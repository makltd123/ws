[project]
name = "ws"
version = "0.1.0"
description = "Context workspaces for Windows: launch, arrange, freeze and switch per-project window sets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Fedor Makovskiy" }]
dependencies = [
    "pywin32>=306",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "typer>=0.12",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
]

[project.scripts]
ws = "ws.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
